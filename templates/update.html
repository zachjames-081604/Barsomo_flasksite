{% extends "base.html" %}

{% block title %}Update Item{% endblock %}

{% block content %}
    <main class="container py-4">
        <h1>Update Item</h1>
        <form method="post">
            <div class="mb-3">
                <label class="form-label" for="name">Name</label>
                <input class="form-control" id="name" name="name" type="text" maxlength="100" value="{{ item.name }}" required>
            </div>
            <button class="btn btn-primary" type="submit">Update</button>
            <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
        </form>
    </main>
{% endblock %}
