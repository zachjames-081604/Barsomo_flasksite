{% extends "base.html" %}

{% block title %}Items{% endblock %}

{% block content %}
    <main class="container py-4">
        <h1>Items</h1>
        <a class="btn btn-primary mb-3" href="{{ url_for('create') }}">Add new item</a>
        {% if items %}
        <ul class="list-group">
            {% for item in items %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ item.name }}
                <div class="d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary" href="{{ url_for('update', idNum=item.idNum) }}">Edit</a>
                    <form method="post" action="{{ url_for('delete', idNum=item.idNum) }}" onsubmit="return confirm('Delete this item?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                    </form>
                </div>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p>No items yet.</p>
        {% endif %}
    </main>
{% endblock %}
